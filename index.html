<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Playlist Forge · Library Alchemy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231DB954'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Ccircle cx='12' cy='12' r='3' fill='%23000'/%3E%3C/svg%3E" />
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #000; color: white; font-family: 'DM Sans', system-ui, sans-serif; }
  .display-font { font-family: 'Anton', sans-serif; letter-spacing: 0.02em; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .grain::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
    opacity: 0.04; pointer-events: none; z-index: 1;
  }
  .glow { box-shadow: 0 0 80px rgba(29, 185, 84, 0.15); }
  .pulse-green { animation: pulseGreen 2s ease-in-out infinite; }
  @keyframes pulseGreen {
    0%, 100% { box-shadow: 0 0 0 0 rgba(29, 185, 84, 0.4); }
    50% { box-shadow: 0 0 0 12px rgba(29, 185, 84, 0); }
  }
  .spin-slow { animation: spin 8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fade-in { animation: fadeIn 0.6s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .marquee {
    background: linear-gradient(90deg, transparent, rgba(29, 185, 84, 0.1) 50%, transparent);
    background-size: 200% 100%;
    animation: marquee 2s linear infinite;
  }
  @keyframes marquee { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  details summary::-webkit-details-marker { display: none; }
  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .editable-name {
    background: transparent; border: none; border-bottom: 1px solid #1DB954;
    width: 100%; padding: 0; font-family: 'Anton', sans-serif;
    letter-spacing: 0.02em; font-size: 1.5rem; line-height: 1.1; color: white;
  }
  .editable-name:focus, .editable-desc:focus { outline: none; }
  .editable-desc {
    background: #111; border: 1px solid #1DB954; border-radius: 6px;
    width: 100%; padding: 6px 8px; font-size: 0.875rem; color: #a3a3a3; resize: none;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const SCOPES = "user-library-read playlist-modify-public playlist-modify-private";

const generateRandomString = (length) => {
  const possible = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  const values = crypto.getRandomValues(new Uint8Array(length));
  return values.reduce((acc, x) => acc + possible[x % possible.length], "");
};
const sha256 = async (plain) => {
  const data = new TextEncoder().encode(plain);
  return await crypto.subtle.digest("SHA-256", data);
};
const base64encode = (input) =>
  btoa(String.fromCharCode(...new Uint8Array(input))).replace(/=/g, "").replace(/\+/g, "-").replace(/\//g, "_");

const Icon = ({ name, className = "w-5 h-5", strokeWidth = 2 }) => {
  const paths = {
    disc:       <><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><path d="M12 12h.01"/></>,
    sparkles:   <><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></>,
    check:      <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>,
    alert:      <><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>,
    copy:       <><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></>,
    checkmark:  <polyline points="20 6 9 17 4 12"/>,
    external:   <><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></>,
    headphones: <><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H4a1 1 0 0 1-1-1v-6a9 9 0 0 1 18 0v6a1 1 0 0 1-1 1h-2a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></>,
    library:    <><path d="M16 6l4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></>,
    wand:       <><path d="M15 4V2"/><path d="M15 16v-2"/><path d="M8 9h2"/><path d="M20 9h2"/><path d="M17.8 11.8L19 13"/><path d="M15 9h0"/><path d="M17.8 6.2L19 5"/><path d="m3 21 9-9"/><path d="M12.2 6.2L11 5"/></>,
    refresh:    <><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></>,
    pencil:     <><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></>,
    trash:      <><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></>,
    plus:       <><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,
  };
  return (
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
      {paths[name]}
    </svg>
  );
};

function App() {
  const [step, setStep]               = useState("setup");
  const [clientId, setClientId]       = useState(localStorage.getItem("spotify_client_id") || "");
  const [accessToken, setAccessToken] = useState(null);
  const [user, setUser]               = useState(null);
  const [tracks, setTracks]           = useState([]);
  const [progress, setProgress]       = useState({ current: 0, total: 0, message: "" });
  const [playlists, setPlaylists]     = useState([]);
  const [userInstructions, setUserInstructions] = useState("");
  const [editingPlaylist, setEditingPlaylist]   = useState(null); // { idx, field }
  const [createdPlaylists, setCreatedPlaylists] = useState(() => {
    try { return JSON.parse(localStorage.getItem("playlist_forge_created_playlists") || "[]"); }
    catch (_) { return []; }
  });
  const [error, setError]   = useState(null);
  const [copied, setCopied] = useState(false);

  const redirectUri = window.location.origin + window.location.pathname;

  // ── OAuth callback detection ──────────────────────────────────────────────
  useEffect(() => {
    const params    = new URLSearchParams(window.location.search);
    const code      = params.get("code");
    const errParam  = params.get("error");
    if (errParam) {
      setError(`Spotify auth error: ${errParam}`);
      window.history.replaceState({}, document.title, window.location.pathname);
      return;
    }
    if (code) {
      const verifier      = localStorage.getItem("spotify_verifier");
      const savedClientId = localStorage.getItem("spotify_client_id");
      if (verifier && savedClientId) {
        window.history.replaceState({}, document.title, window.location.pathname);
        exchangeCodeForToken(code, verifier, savedClientId);
      } else {
        setError("Lost auth state. Try connecting again.");
      }
    }
  }, []);

  // ── Auth helpers ──────────────────────────────────────────────────────────
  const copyRedirect = () => {
    navigator.clipboard.writeText(redirectUri);
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  const startAuth = async () => {
    if (!clientId.trim()) { setError("Enter your Spotify Client ID first"); return; }
    setError(null);
    localStorage.setItem("spotify_client_id", clientId);
    const verifier  = generateRandomString(64);
    const challenge = base64encode(await sha256(verifier));
    localStorage.setItem("spotify_verifier", verifier);
    const authUrl = new URL("https://accounts.spotify.com/authorize");
    authUrl.searchParams.set("client_id", clientId);
    authUrl.searchParams.set("response_type", "code");
    authUrl.searchParams.set("redirect_uri", redirectUri);
    authUrl.searchParams.set("scope", SCOPES);
    authUrl.searchParams.set("code_challenge_method", "S256");
    authUrl.searchParams.set("code_challenge", challenge);
    window.location.href = authUrl.toString();
  };

  const exchangeCodeForToken = async (code, verifier, cid) => {
    setStep("fetching");
    setProgress({ current: 0, total: 0, message: "Authenticating" });
    try {
      const resp = await fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ client_id: cid, grant_type: "authorization_code", code, redirect_uri: redirectUri, code_verifier: verifier }),
      });
      const data = await resp.json();
      if (data.error) { setError(`Token error: ${data.error_description || data.error}`); setStep("setup"); return; }
      localStorage.removeItem("spotify_verifier");
      setAccessToken(data.access_token);
      const userResp = await fetch("https://api.spotify.com/v1/me", { headers: { Authorization: `Bearer ${data.access_token}` } });
      const userData = await userResp.json();
      setUser(userData);
      fetchLikedSongs(data.access_token);
    } catch (e) { setError(`Token exchange failed: ${e.message}`); setStep("setup"); }
  };

  // ── Spotify fetch ─────────────────────────────────────────────────────────
  const fetchLikedSongs = async (token) => {
    try {
      let allTracks = [], url = "https://api.spotify.com/v1/me/tracks?limit=50", total = 0;
      while (url) {
        const resp = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
        if (!resp.ok) throw new Error(`Spotify error ${resp.status}`);
        const data = await resp.json();
        total = data.total;
        allTracks.push(...data.items.filter((i) => i.track && i.track.id));
        setProgress({ current: allTracks.length, total, message: "Pulling your liked songs" });
        url = data.next;
      }
      const artistIds    = [...new Set(allTracks.flatMap((i) => i.track.artists.map((a) => a.id).filter(Boolean)))];
      const artistGenres = {};
      for (let i = 0; i < artistIds.length; i += 50) {
        const batch = artistIds.slice(i, i + 50);
        const resp  = await fetch(`https://api.spotify.com/v1/artists?ids=${batch.join(",")}`, { headers: { Authorization: `Bearer ${token}` } });
        const data  = await resp.json();
        if (data.artists) data.artists.forEach((a) => { if (a) artistGenres[a.id] = a.genres || []; });
        setProgress({ current: i + batch.length, total: artistIds.length, message: "Decoding genres from your artists" });
      }
      const enriched = allTracks.map((item) => {
        const genres      = item.track.artists.flatMap((a) => artistGenres[a.id] || []);
        const releaseDate = item.track.album?.release_date || "";
        const releaseYear = releaseDate ? Number(releaseDate.slice(0, 4)) : null;
        return {
          id: item.track.id, uri: item.track.uri, name: item.track.name,
          artists: item.track.artists.map((a) => a.name).join(", "),
          album: item.track.album?.name || "", releaseDate, releaseYear,
          genres: [...new Set(genres)],
        };
      });
      setTracks(enriched);
      setStep("analyzing");
      analyzeTracks(enriched, "");
    } catch (e) { setError(`Fetch failed: ${e.message}`); }
  };

  // ── AI analysis ───────────────────────────────────────────────────────────
  const analyzeTracks = async (trackList, instructions = "") => {
    try {
      setStep("analyzing");
      setProgress({ current: 0, total: 100, message: "Claude is reading the room" });

      const compact = trackList
        .map((t, i) => `${i}|${t.name.slice(0, 50)}|${t.artists.slice(0, 50)}|${t.releaseYear || "unknown"}|${t.genres.slice(0, 4).join(",") || "none"}`)
        .join("\n");

      const instructionBlock = instructions.trim()
        ? `\nUSER INSTRUCTIONS — these are top priority and override the defaults where they conflict:\n${instructions.trim()}\n`
        : "";

      const prompt = `Organize this Spotify library into playlists. Format per line: index|track|artist|releaseYear|genres

${compact}

Default rules (follow unless User Instructions override):
- Group by BOTH genre and era. Genre first, but era almost as important.
- Do NOT mix songs that are far apart in era, even if the genre is similar. Keep playlists within roughly the same decade or 10-15 year window.
- Make separate playlists for older vs newer versions of the same broad genre (e.g., 80s pop, 2000s pop, modern pop; classic country vs modern country).
- Merge adjacent/related genres only when they also share the same era.
- Exception: Disney, musical, soundtrack, kids, and animated movie music can stay together even across eras.
- EVERY song (indices 0 to ${trackList.length - 1}) must appear in exactly ONE playlist.
- Avoid playlists with fewer than 4 tracks; merge small clusters into the nearest genre + era match.
- Songs with "unknown" year or "none" genre: place them by artist/song knowledge.
- Playlist names should be evocative (genre + vibe + era when useful), e.g. "2000s Pop Rush", "Classic Country Roads", "Modern Worship Glow".
- Descriptions: punchy, under 90 chars.
${instructionBlock}
Return ONLY valid JSON — no markdown, no preamble:
{"playlists":[{"name":"...","description":"...","trackIndices":[0,1,2]}]}`;

      const response = await fetch("/api/claude", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt }),
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error);

      const text    = data.content.filter((c) => c.type === "text").map((c) => c.text).join("");
      const cleaned = text.replace(/```json|```/g, "").trim();
      const parsed  = JSON.parse(cleaned);

      // Catch any missed indices
      const allIndices = new Set();
      parsed.playlists.forEach((p) => p.trackIndices.forEach((i) => allIndices.add(i)));
      const missing = [];
      for (let i = 0; i < trackList.length; i++) if (!allIndices.has(i)) missing.push(i);
      if (missing.length > 0)
        parsed.playlists.push({ name: "Stragglers", description: "Tracks that didn't fit a cluster", trackIndices: missing });

      setPlaylists(parsed.playlists);
      setEditingPlaylist(null);
      setStep("review");
    } catch (e) {
      setError(`AI analysis failed: ${e.message}`);
      setStep(tracks.length ? "review" : "setup");
    }
  };

  // ── Playlist editing helpers ──────────────────────────────────────────────
  const updatePlaylistField = (idx, field, value) =>
    setPlaylists((prev) => { const next = [...prev]; next[idx] = { ...next[idx], [field]: value }; return next; });

  const deletePlaylist = (idx) => {
    setPlaylists((prev) => {
      const removed = prev[idx].trackIndices;
      const next    = prev.filter((_, i) => i !== idx);
      const si      = next.findIndex((p) => p.name === "Stragglers");
      if (si >= 0) next[si] = { ...next[si], trackIndices: [...next[si].trackIndices, ...removed] };
      else if (removed.length > 0) next.push({ name: "Stragglers", description: "Tracks moved from deleted playlists", trackIndices: removed });
      return next;
    });
    setEditingPlaylist(null);
  };

  const moveTrack = (trackIndex, fromIdx, toIdxValue) => {
    const toIdx = Number(toIdxValue);
    if (Number.isNaN(toIdx) || toIdx === fromIdx) return;
    setPlaylists((prev) => {
      const next = prev.map((p) => ({ ...p, trackIndices: [...p.trackIndices] }));
      next[fromIdx].trackIndices = next[fromIdx].trackIndices.filter((i) => i !== trackIndex);
      if (!next[toIdx].trackIndices.includes(trackIndex)) next[toIdx].trackIndices.push(trackIndex);
      return next;
    });
  };

  // ── Spotify write helpers ─────────────────────────────────────────────────
  const parseJsonSafe = (text) => { try { return text ? JSON.parse(text) : {}; } catch (_) { return {}; } };

  const replacePlaylistTracks = async (id, name, uris) => {
    const r = await fetch(`https://api.spotify.com/v1/playlists/${id}/tracks`, {
      method: "PUT",
      headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" },
      body: JSON.stringify({ uris: uris.slice(0, 100) }),
    });
    if (!r.ok) { const d = parseJsonSafe(await r.text()); throw new Error(`Replace failed for "${name}": ${d.error?.message || r.status}`); }
    for (let j = 100; j < uris.length; j += 100) {
      const ar = await fetch(`https://api.spotify.com/v1/playlists/${id}/tracks`, {
        method: "POST",
        headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" },
        body: JSON.stringify({ uris: uris.slice(j, j + 100) }),
      });
      if (!ar.ok) { const d = parseJsonSafe(await ar.text()); throw new Error(`Add failed for "${name}": ${d.error?.message || ar.status}`); }
    }
  };

  const syncPlaylists = async (refreshExisting = false) => {
    setStep("creating"); setError(null);
    const created = [], saved = createdPlaylists.length ? createdPlaylists : [];
    try {
      for (let i = 0; i < playlists.length; i++) {
        const pl       = playlists[i];
        const uris     = pl.trackIndices.map((idx) => tracks[idx]?.uri).filter(Boolean);
        const existing = refreshExisting ? saved[i] : null;
        setProgress({ current: i, total: playlists.length, message: existing?.id ? `Refreshing "${pl.name}"` : `Building "${pl.name}"` });
        let target = existing;
        if (existing?.id) {
          await fetch(`https://api.spotify.com/v1/playlists/${existing.id}`, {
            method: "PUT",
            headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" },
            body: JSON.stringify({ name: pl.name, description: pl.description, public: false }),
          });
          await replacePlaylistTracks(existing.id, pl.name, uris);
          target = { ...existing, name: pl.name, description: pl.description };
        } else {
          const cr = await fetch(`https://api.spotify.com/v1/me/playlists`, {
            method: "POST",
            headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" },
            body: JSON.stringify({ name: pl.name, description: pl.description, public: false }),
          });
          const crText = await cr.text(), newPl = parseJsonSafe(crText);
          if (!cr.ok) throw new Error(newPl.error?.message || `Could not create "${pl.name}": ${cr.status}`);
          await replacePlaylistTracks(newPl.id, pl.name, uris);
          target = newPl;
        }
        created.push({ ...target, trackCount: uris.length });
      }
      setCreatedPlaylists(created);
      localStorage.setItem("playlist_forge_created_playlists", JSON.stringify(created));
      setProgress({ current: playlists.length, total: playlists.length, message: "Complete" });
      setStep("done");
    } catch (e) {
      setError(`Creation failed: ${e.message}`);
      setCreatedPlaylists(created);
      if (created.length) localStorage.setItem("playlist_forge_created_playlists", JSON.stringify(created));
    }
  };

  const createPlaylists  = () => syncPlaylists(false);
  const refreshExisting  = () => syncPlaylists(true);

  const reset = () => {
    setStep("setup"); setAccessToken(null); setUser(null); setTracks([]); setPlaylists([]);
    setCreatedPlaylists([]); setError(null); setUserInstructions(""); setEditingPlaylist(null);
    setProgress({ current: 0, total: 0, message: "" });
  };

  // ─────────────────────────────────────────────────────────────────────────
  return (
    <div className="min-h-screen w-full bg-black text-white relative overflow-hidden grain">
      <div className="fixed inset-0 opacity-30 pointer-events-none">
        <div className="absolute top-0 left-1/4 w-96 h-96 rounded-full" style={{ background: "radial-gradient(circle, #1DB954 0%, transparent 70%)", filter: "blur(60px)" }}></div>
        <div className="absolute bottom-0 right-1/4 w-96 h-96 rounded-full" style={{ background: "radial-gradient(circle, #F5F1E8 0%, transparent 70%)", filter: "blur(80px)", opacity: 0.3 }}></div>
      </div>

      <div className="relative z-10 max-w-5xl mx-auto px-6 py-10">

        {/* ── Header ─────────────────────────────────────── */}
        <header className="flex items-center justify-between mb-12 fade-in">
          <div className="flex items-center gap-3">
            <Icon name="disc" className="w-9 h-9 text-green-500 spin-slow" strokeWidth={1.5} />
            <div>
              <h1 className="display-font text-3xl leading-none">PLAYLIST FORGE</h1>
              <p className="mono text-xs text-neutral-500 tracking-widest">VOL. 01 · LIBRARY ALCHEMY</p>
            </div>
          </div>
          {user && (
            <div className="flex items-center gap-3 text-right">
              <div>
                <div className="mono text-xs text-neutral-500">SIGNED IN</div>
                <div className="text-sm font-medium">{user.display_name}</div>
              </div>
              {user.images?.[0] && <img src={user.images[0].url} className="w-10 h-10 rounded-full ring-2 ring-green-500" alt="" />}
            </div>
          )}
        </header>

        {/* ── Error banner ────────────────────────────────── */}
        {error && (
          <div className="mb-6 p-4 border border-red-500/40 bg-red-500/5 rounded-lg flex items-start gap-3 fade-in">
            <Icon name="alert" className="w-5 h-5 text-red-400 flex-shrink-0 mt-0.5" />
            <div className="flex-1">
              <div className="text-sm font-medium text-red-300">{error}</div>
              <button onClick={() => setError(null)} className="mono text-xs text-red-400/70 hover:text-red-300 mt-1">DISMISS</button>
            </div>
          </div>
        )}

        {/* ══════════════════════════════════════════════════
            SETUP
        ══════════════════════════════════════════════════ */}
        {step === "setup" && (
          <div className="fade-in">
            <div className="grid md:grid-cols-2 gap-12 items-start">
              <div>
                <div className="mono text-xs text-green-500 mb-4 tracking-widest">// STEP ONE</div>
                <h2 className="display-font text-6xl md:text-7xl leading-[0.9] mb-6">TURN YOUR LIKES<br />INTO A LIBRARY</h2>
                <p className="text-neutral-400 text-lg leading-relaxed mb-8">
                  We'll pull every track you've liked, decode their genres, and let Claude carve them into beautifully-grouped playlists — adjacent genres merged, every song accounted for, all dropped straight into your Spotify.
                </p>
                <div className="space-y-3 mono text-sm text-neutral-500">
                  {["Connect Spotify","Pull liked songs + genres","Claude clusters them","Review, edit & tweak","Auto-create playlists"].map((s, i) => (
                    <div key={i} className="flex items-center gap-3"><span className="text-green-500">{String(i+1).padStart(2,"0")}.</span>{s}</div>
                  ))}
                </div>
              </div>

              <div className="bg-neutral-950 border border-neutral-800 rounded-2xl p-8 glow">
                <div className="mono text-xs text-neutral-500 mb-2 tracking-widest">SPOTIFY DEVELOPER SETUP</div>
                <h3 className="display-font text-2xl mb-6">ONE-TIME CONFIG</h3>
                <ol className="space-y-5 text-sm mb-6">
                  <li className="flex gap-3">
                    <span className="display-font text-2xl text-green-500 leading-none">1</span>
                    <div>
                      <div className="text-white">Open the <a href="https://developer.spotify.com/dashboard" target="_blank" rel="noopener noreferrer" className="text-green-500 underline hover:text-green-400">Spotify Developer Dashboard <Icon name="external" className="w-3 h-3 inline" /></a></div>
                      <div className="text-neutral-500 mt-1">Log in with your normal Spotify account</div>
                    </div>
                  </li>
                  <li className="flex gap-3">
                    <span className="display-font text-2xl text-green-500 leading-none">2</span>
                    <div>
                      <div className="text-white">Click "Create app"</div>
                      <div className="text-neutral-500 mt-1">Name: anything, e.g. "Playlist Forge"</div>
                    </div>
                  </li>
                  <li className="flex gap-3">
                    <span className="display-font text-2xl text-green-500 leading-none">3</span>
                    <div className="flex-1 min-w-0">
                      <div className="text-white">Add this Redirect URI:</div>
                      <button onClick={copyRedirect} className="mt-2 group flex items-center gap-2 bg-black border border-neutral-800 hover:border-green-500/50 rounded px-3 py-2 mono text-xs w-full text-left transition-colors">
                        <span className="truncate flex-1 text-neutral-300">{redirectUri}</span>
                        {copied ? <Icon name="checkmark" className="w-4 h-4 text-green-500 flex-shrink-0" /> : <Icon name="copy" className="w-4 h-4 text-neutral-500 group-hover:text-white flex-shrink-0" />}
                      </button>
                      <div className="text-neutral-500 mt-1 text-xs">Select "Web API" under APIs used. Save.</div>
                    </div>
                  </li>
                  <li className="flex gap-3">
                    <span className="display-font text-2xl text-green-500 leading-none">4</span>
                    <div className="flex-1">
                      <div className="text-white mb-2">Copy your Client ID and paste below:</div>
                      <input value={clientId} onChange={(e) => setClientId(e.target.value)} onKeyDown={(e) => e.key === "Enter" && startAuth()} placeholder="Client ID"
                        className="w-full bg-black border border-neutral-800 focus:border-green-500 rounded px-3 py-2.5 text-sm mono outline-none transition-colors" />
                    </div>
                  </li>
                </ol>
                <button onClick={startAuth} disabled={!clientId.trim()}
                  className="w-full bg-green-500 hover:bg-green-400 disabled:bg-neutral-800 disabled:text-neutral-600 text-black disabled:cursor-not-allowed font-bold py-3.5 rounded-full transition-all flex items-center justify-center gap-2 pulse-green disabled:animate-none">
                  <Icon name="headphones" className="w-5 h-5" /> CONNECT SPOTIFY
                </button>
              </div>
            </div>
          </div>
        )}

        {/* ══════════════════════════════════════════════════
            FETCHING / ANALYZING
        ══════════════════════════════════════════════════ */}
        {(step === "fetching" || step === "analyzing") && (
          <div className="fade-in min-h-[60vh] flex items-center justify-center">
            <div className="text-center max-w-xl">
              <div className="relative inline-block mb-8">
                {step === "analyzing"
                  ? <Icon name="wand" className="w-20 h-20 text-green-500" strokeWidth={1.2} />
                  : <Icon name="disc" className="w-20 h-20 text-green-500 spin-slow" strokeWidth={1.2} />}
              </div>
              <div className="mono text-xs text-green-500 mb-3 tracking-widest">
                {step === "fetching" ? "// READING LIBRARY" : "// COMPOSING CLUSTERS"}
              </div>
              <h2 className="display-font text-5xl md:text-6xl mb-4">{progress.message}</h2>
              {progress.total > 0 && (
                <div className="mt-8">
                  <div className="flex justify-between mono text-xs text-neutral-500 mb-2">
                    <span>{progress.current.toLocaleString()}</span>
                    <span>{progress.total.toLocaleString()}</span>
                  </div>
                  <div className="h-1 bg-neutral-900 rounded-full overflow-hidden marquee">
                    <div className="h-full bg-green-500 transition-all duration-300" style={{ width: `${Math.min(100, (progress.current / progress.total) * 100)}%` }}></div>
                  </div>
                </div>
              )}
              {step === "analyzing" && (
                <p className="text-neutral-500 text-sm mt-6">
                  Sorting {tracks.length.toLocaleString()} tracks into genre clusters.
                  {userInstructions.trim() ? " Applying your custom instructions." : ""} Usually takes 20–60 seconds.
                </p>
              )}
            </div>
          </div>
        )}

        {/* ══════════════════════════════════════════════════
            REVIEW
        ══════════════════════════════════════════════════ */}
        {step === "review" && (
          <div className="fade-in">

            {/* top bar */}
            <div className="mb-8 flex items-end justify-between flex-wrap gap-4">
              <div>
                <div className="mono text-xs text-green-500 mb-2 tracking-widest">// PROPOSAL</div>
                <h2 className="display-font text-5xl md:text-6xl leading-none">{playlists.length} PLAYLIST{playlists.length === 1 ? "" : "S"}</h2>
                <p className="text-neutral-400 mt-2">{tracks.length.toLocaleString()} songs · edit names, descriptions & tracks below</p>
              </div>
              <div className="flex flex-wrap gap-3">
                {createdPlaylists.length > 0 && (
                  <button onClick={refreshExisting} className="border border-green-500/60 hover:border-green-400 text-green-400 hover:text-green-300 font-bold px-6 py-3.5 rounded-full transition-all flex items-center gap-2">
                    <Icon name="refresh" className="w-4 h-4" /> REFRESH EXISTING
                  </button>
                )}
                <button onClick={createPlaylists} className="bg-green-500 hover:bg-green-400 text-black font-bold px-8 py-3.5 rounded-full transition-all flex items-center gap-2 pulse-green">
                  <Icon name="sparkles" className="w-5 h-5" /> CREATE NEW IN SPOTIFY
                </button>
              </div>
            </div>

            {/* ── Re-analyze panel ───────────────────────── */}
            <div className="mb-8 bg-neutral-950 border border-green-500/20 rounded-2xl p-6">
              <div className="flex items-center gap-2 mb-1">
                <Icon name="wand" className="w-4 h-4 text-green-500" />
                <span className="mono text-xs text-green-500 tracking-widest">RE-ANALYZE WITH CLAUDE</span>
              </div>
              <p className="text-sm text-neutral-400 mb-4">
                Not happy with the split? Give Claude specific instructions and it'll redo the whole thing fresh from your library.
              </p>
              <textarea
                value={userInstructions}
                onChange={(e) => setUserInstructions(e.target.value)}
                rows={5}
                placeholder={"Examples (type your own, or use these as a starting point):\n• Keep all Christian / worship music in one playlist\n• Don't split country by era — one big country playlist\n• Separate pop by decade: 90s, 2000s, 2010s, modern\n• Make a dedicated workout / hype playlist\n• Keep all Taylor Swift together regardless of era"}
                className="w-full bg-black border border-neutral-800 focus:border-green-500 rounded-lg px-4 py-3 text-sm mono text-neutral-300 placeholder-neutral-700 outline-none transition-colors resize-none"
              />
              <div className="mt-3 flex items-center gap-4 flex-wrap">
                <button
                  onClick={() => analyzeTracks(tracks, userInstructions)}
                  className="bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 hover:border-green-500/60 text-white font-bold px-6 py-2.5 rounded-full transition-all flex items-center gap-2"
                >
                  <Icon name="refresh" className="w-4 h-4 text-green-500" /> RE-ANALYZE
                </button>
                {userInstructions.trim() && (
                  <button onClick={() => setUserInstructions("")} className="mono text-xs text-neutral-600 hover:text-neutral-400 transition-colors">CLEAR</button>
                )}
                <span className="mono text-xs text-neutral-700">Discards manual edits and starts fresh · all your songs re-sorted</span>
              </div>
            </div>

            {/* ── Playlist grid ───────────────────────────── */}
            <div className="grid md:grid-cols-2 gap-4">
              {playlists.map((p, idx) => (
                <div key={idx} className="bg-neutral-950 border border-neutral-800 hover:border-neutral-700 transition-colors rounded-xl overflow-hidden">
                  <div className="p-5">

                    {/* name row */}
                    <div className="flex items-start justify-between mb-2">
                      <div className="flex-1 min-w-0 mr-3">
                        <div className="mono text-[10px] text-green-500 tracking-widest mb-1 flex items-center gap-2">
                          SIDE {String.fromCharCode(65 + (idx % 26))}{Math.floor(idx / 26) || ""}
                          <span className="text-neutral-700">· CLICK TO EDIT</span>
                        </div>
                        {editingPlaylist?.idx === idx && editingPlaylist?.field === "name" ? (
                          <input autoFocus value={p.name}
                            onChange={(e) => updatePlaylistField(idx, "name", e.target.value)}
                            onBlur={() => setEditingPlaylist(null)}
                            onKeyDown={(e) => e.key === "Enter" && setEditingPlaylist(null)}
                            className="editable-name" />
                        ) : (
                          <h3 onClick={() => setEditingPlaylist({ idx, field: "name" })} title="Click to rename"
                            className="display-font text-2xl leading-tight truncate cursor-text hover:text-green-400 transition-colors group flex items-center gap-2">
                            {p.name}
                            <Icon name="pencil" className="w-3 h-3 text-neutral-700 group-hover:text-green-500 flex-shrink-0" strokeWidth={2} />
                          </h3>
                        )}
                      </div>
                      <div className="flex flex-col items-end gap-2 flex-shrink-0">
                        <div className="text-right">
                          <div className="display-font text-3xl text-green-500 leading-none">{p.trackIndices.length}</div>
                          <div className="mono text-[10px] text-neutral-500 tracking-widest">TRACKS</div>
                        </div>
                        <button onClick={() => deletePlaylist(idx)} title="Delete (tracks go to Stragglers)"
                          className="text-neutral-700 hover:text-red-400 transition-colors">
                          <Icon name="trash" className="w-4 h-4" strokeWidth={1.5} />
                        </button>
                      </div>
                    </div>

                    {/* description */}
                    <div className="mb-4">
                      {editingPlaylist?.idx === idx && editingPlaylist?.field === "description" ? (
                        <textarea autoFocus value={p.description} rows={2}
                          onChange={(e) => updatePlaylistField(idx, "description", e.target.value)}
                          onBlur={() => setEditingPlaylist(null)}
                          className="editable-desc w-full" />
                      ) : (
                        <p onClick={() => setEditingPlaylist({ idx, field: "description" })} title="Click to edit description"
                          className="text-sm text-neutral-400 line-clamp-2 cursor-text hover:text-neutral-200 transition-colors">
                          {p.description || <span className="italic text-neutral-600">No description — click to add</span>}
                        </p>
                      )}
                    </div>

                    {/* track list */}
                    <details className="group">
                      <summary className="mono text-xs text-neutral-500 hover:text-green-500 cursor-pointer flex items-center gap-1.5">
                        <span className="group-open:rotate-90 transition-transform inline-block">▸</span>
                        VIEW / MOVE TRACKS
                      </summary>
                      <div className="mt-3 max-h-72 overflow-y-auto space-y-2 pr-1 text-xs">
                        {p.trackIndices.length === 0 && (
                          <div className="text-neutral-600 mono text-[10px] pt-2">No tracks. Move some in or delete this playlist.</div>
                        )}
                        {p.trackIndices.map((tIdx) => {
                          const t = tracks[tIdx];
                          if (!t) return null;
                          return (
                            <div key={`${idx}-${tIdx}`} className="grid grid-cols-[1fr_auto] gap-2 items-center bg-black/30 border border-neutral-900 rounded-lg px-2 py-2">
                              <div className="min-w-0 flex items-baseline gap-2 text-neutral-300">
                                <span className="text-neutral-700 mono text-[10px] flex-shrink-0">{String(tIdx + 1).padStart(3, "0")}</span>
                                <span className="truncate">
                                  <span className="text-white">{t.name}</span>
                                  <span className="text-neutral-500"> — {t.artists}{t.releaseYear ? ` (${t.releaseYear})` : ""}</span>
                                </span>
                              </div>
                              <select value="" onChange={(e) => moveTrack(tIdx, idx, e.target.value)}
                                className="bg-neutral-950 border border-neutral-800 hover:border-green-500/50 text-neutral-300 rounded px-2 py-1 mono text-[10px] outline-none max-w-[140px]">
                                <option value="" disabled>MOVE TO…</option>
                                {playlists.map((tgt, tgtIdx) => (
                                  <option key={tgtIdx} value={tgtIdx} disabled={tgtIdx === idx}>
                                    {tgtIdx === idx ? "Current" : tgt.name}
                                  </option>
                                ))}
                              </select>
                            </div>
                          );
                        })}
                      </div>
                    </details>
                  </div>
                </div>
              ))}

              {/* add playlist tile */}
              <button
                onClick={() => setPlaylists((prev) => [...prev, { name: "New Playlist", description: "", trackIndices: [] }])}
                className="border-2 border-dashed border-neutral-800 hover:border-green-500/40 rounded-xl p-8 flex flex-col items-center justify-center gap-3 text-neutral-600 hover:text-green-500 transition-all min-h-[140px]"
              >
                <Icon name="plus" className="w-8 h-8" strokeWidth={1.5} />
                <span className="mono text-xs tracking-widest">ADD PLAYLIST</span>
              </button>
            </div>
          </div>
        )}

        {/* ══════════════════════════════════════════════════
            CREATING
        ══════════════════════════════════════════════════ */}
        {step === "creating" && (
          <div className="fade-in min-h-[60vh] flex items-center justify-center">
            <div className="text-center max-w-xl">
              <Icon name="library" className="w-20 h-20 text-green-500 mx-auto mb-8" strokeWidth={1.2} />
              <div className="mono text-xs text-green-500 mb-3 tracking-widest">// COMMITTING TO SPOTIFY</div>
              <h2 className="display-font text-5xl md:text-6xl mb-4">{progress.message}</h2>
              <div className="mt-8">
                <div className="flex justify-between mono text-xs text-neutral-500 mb-2">
                  <span>{progress.current} of {progress.total}</span>
                  <span>{Math.round((progress.current / progress.total) * 100)}%</span>
                </div>
                <div className="h-1 bg-neutral-900 rounded-full overflow-hidden">
                  <div className="h-full bg-green-500 transition-all duration-300" style={{ width: `${(progress.current / progress.total) * 100}%` }}></div>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* ══════════════════════════════════════════════════
            DONE
        ══════════════════════════════════════════════════ */}
        {step === "done" && (
          <div className="fade-in">
            <div className="text-center mb-12">
              <Icon name="check" className="w-16 h-16 text-green-500 mx-auto mb-4" strokeWidth={1.5} />
              <div className="mono text-xs text-green-500 mb-2 tracking-widest">// PRESSED TO VINYL</div>
              <h2 className="display-font text-6xl md:text-7xl leading-none mb-3">DONE.</h2>
              <p className="text-neutral-400 text-lg">{createdPlaylists.length} playlist{createdPlaylists.length === 1 ? "" : "s"} now living in your Spotify</p>
            </div>
            <div className="grid md:grid-cols-2 gap-3 mb-12">
              {createdPlaylists.map((p, idx) => (
                <a key={p.id} href={p.external_urls?.spotify} target="_blank" rel="noopener noreferrer"
                  className="group bg-neutral-950 border border-neutral-800 hover:border-green-500 hover:bg-neutral-900 transition-all rounded-xl p-4 flex items-center justify-between">
                  <div className="flex items-center gap-4 min-w-0">
                    <div className="display-font text-2xl text-neutral-700 group-hover:text-green-500 transition-colors w-8 flex-shrink-0">{String(idx + 1).padStart(2, "0")}</div>
                    <div className="min-w-0">
                      <div className="display-font text-lg leading-tight truncate">{p.name}</div>
                      <div className="mono text-xs text-neutral-500">{p.trackCount} tracks</div>
                    </div>
                  </div>
                  <Icon name="external" className="w-4 h-4 text-neutral-600 group-hover:text-green-500 transition-colors flex-shrink-0 ml-3" />
                </a>
              ))}
            </div>
            <div className="text-center flex flex-wrap gap-3 justify-center">
              <button onClick={() => setStep("review")} className="mono text-xs text-green-400 hover:text-green-300 tracking-widest border border-green-500/50 hover:border-green-400 rounded-full px-6 py-3 transition-colors">
                EDIT / REFRESH THESE PLAYLISTS
              </button>
              <button onClick={reset} className="mono text-xs text-neutral-500 hover:text-white tracking-widest border border-neutral-800 hover:border-neutral-600 rounded-full px-6 py-3 transition-colors">
                START OVER
              </button>
            </div>
          </div>
        )}

        <footer className="mt-16 pt-8 border-t border-neutral-900 mono text-[10px] text-neutral-600 tracking-widest text-center">
          PLAYLIST FORGE · POWERED BY SPOTIFY WEB API + CLAUDE
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
